<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Individual Finger Tracker</title>
    <style>

        #liveView {
            position: relative;
            width: 640px;
            height: 480px;
            background: #000;
            border-radius: 10px;
            border: 4px solid #333;
        }
/* this is to mirror te image  */
        #webcam, #output_canvas {
            position: absolute;
            left: 0;
            top: 0;
            width: 640px;
            height: 480px;
            transform: scaleX(-1);
        }
/* this moves the overlay to where the hand actually is  */
        #ui-overlay {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.8);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #444;
            z-index: 20;
            min-width: 150px;
        }
/* text box that shows the fingers */
        .finger-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
            font-size: 14px;
        }
/* percente openess of fingers */
        .percent-val {
            color: #00FF00;
            font-weight: bold;
        }
/* css for button  */
        #webcamButton {
            padding: 15px 30px;
            font-size: 18px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <h1>Independent Finger Tracking</h1>
<button id="webcamButton">ENABLE WEBCAM</button>

    <div id="liveView">
        <div id="ui-overlay">
            <div class="finger-row">Thumb: <span id="thumb-val" class="percent-val">0%</span></div>
            <div class="finger-row">Index: <span id="index-val" class="percent-val">0%</span></div>
            <div class="finger-row">Middle: <span id="middle-val" class="percent-val">0%</span></div>
            <div class="finger-row">Ring: <span id="ring-val" class="percent-val">0%</span></div>
            <div class="finger-row">Pinky: <span id="pinky-val" class="percent-val">0%</span></div>
        </div>
        <video id="webcam" autoplay playsinline></video>
        <canvas id="output_canvas"></canvas>
    </div>

    <script type="module">
        import {
            HandLandmarker,
            FilesetResolver,
            DrawingUtils
        } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.0";

        const video = document.getElementById("webcam");
        const canvasElement = document.getElementById("output_canvas");
        const canvasCtx = canvasElement.getContext("2d");
        const webcamButton = document.getElementById("webcamButton");

        const uiElements = {
            thumb: document.getElementById("thumb-val"),
            index: document.getElementById("index-val"),
            middle: document.getElementById("middle-val"),
            ring: document.getElementById("ring-val"),
            pinky: document.getElementById("pinky-val")
        };

        let handLandmarker = undefined;
        let lastVideoTime = -1;

        // Configurations for independent finger scaling
        const fingerConfigs = {
            thumb:  { tip: 4,  min: 0.15, max: 0.45 },
            index:  { tip: 8,  min: 0.20, max: 0.70 },
            middle: { tip: 12, min: 0.20, max: 0.75 },
            ring:   { tip: 16, min: 0.20, max: 0.70 },
            pinky:  { tip: 20, min: 0.15, max: 0.60 }
        };

        function getDistance(p1, p2) {
            return Math.sqrt(Math.pow(p1.x - p2.x, 2) + Math.pow(p1.y - p2.y, 2) + Math.pow(p1.z - p2.z, 2));
        }

        async function createHandLandmarker() {
            const vision = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.0/wasm");
            handLandmarker = await HandLandmarker.createFromOptions(vision, {
                baseOptions: {
                    modelAssetPath: "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
                    delegate: "GPU"
                },
                runningMode: "VIDEO",
                numHands: 1
            });
            console.log("Model Ready");
        }
        createHandLandmarker();

        webcamButton.addEventListener("click", async () => {
            webcamButton.style.display = "none";
            const stream = await navigator.mediaDevices.getUserMedia({ video: true });
            video.srcObject = stream;
            video.addEventListener("loadeddata", () => {
                canvasElement.width = video.videoWidth;
                canvasElement.height = video.videoHeight;
                predictWebcam();
            });
        });

        async function predictWebcam() {
            let startTimeMs = performance.now();
            if (lastVideoTime !== video.currentTime) {
                lastVideoTime = video.currentTime;
                const results = handLandmarker.detectForVideo(video, startTimeMs);

                canvasCtx.save();
                canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
                const drawingUtils = new DrawingUtils(canvasCtx);

                if (results.landmarks && results.landmarks.length > 0) {
                    for (const landmarks of results.landmarks) {
                        drawingUtils.drawConnectors(landmarks, HandLandmarker.HAND_CONNECTIONS, { color: "#00FF00", lineWidth: 5 });
                        drawingUtils.drawLandmarks(landmarks, { color: "#FF0000", lineWidth: 1 });

                        const wrist = landmarks[0];

                        for (const [name, config] of Object.entries(fingerConfigs)) {
                            const dist = getDistance(wrist, landmarks[config.tip]);
                            let openness = (dist - config.min) / (config.max - config.min);
                            openness = Math.min(Math.max(openness, 0), 1);
                            const percent = Math.round(openness * 100);
                            uiElements[name].innerText = percent + "%";
                        }
                    }
                }
                canvasCtx.restore();
            }
            window.requestAnimationFrame(predictWebcam);
        }
    </script>

</body>
</html>
