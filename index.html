<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Individual Finger Tracker</title>
    <style>
        /* flat dark mode setup */
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            margin: 0;
            padding: 40px 20px;
            box-sizing: border-box;
        }

        h1 {
            font-weight: 400;
            letter-spacing: -0.5px;
            margin-bottom: 30px;
        }

        .main-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            margin-bottom: 30px;
        }

        #liveView {
            position: relative;
            width: 640px;
            height: 480px;
            background: #0a0a0a;
            border-radius: 8px;
            overflow: hidden;
        }

        /* mirror the image */
        #webcam, #output_canvas {
            position: absolute;
            left: 0;
            top: 0;
            width: 640px;
            height: 480px;
            transform: scaleX(-1);
        }

        /* overlay inside camera view */
        #ui-overlay {
            position: absolute;
            top: 15px;
            right: 15px;
            z-index: 20;
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 450px;
            overflow-y: auto;
        }

        /* Individual hand container box styling */
        .hand-box {
            background: rgba(0, 0, 0, 0.75);
            padding: 12px 16px;
            border-radius: 6px;
            min-width: 130px;
        }

        .hand-title {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #888888;
            margin-bottom: 6px;
            font-weight: bold;
        }

        /* text box that shows the fingers */
        .finger-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 6px;
            font-size: 13px;
            color: #cccccc;
        }

        .finger-row:last-child {
            margin-bottom: 0;
        }

        /* percent openness of fingers */
        .percent-val {
            color: #ffffff;
            font-weight: 600;
        }

        /* css for button */
        #webcamButton {
            padding: 12px 32px;
            font-size: 15px;
            font-weight: 500;
            background-color: #ffffff;
            color: #000000;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.15s ease;
        }

        #webcamButton:hover {
            background-color: #cccccc;
        }
    </style>
</head>
<body>

    <h1>Hand Tracker</h1>

    <div class="main-container">
        <div id="liveView">
            <div id="ui-overlay"></div>
            <video id="webcam" autoplay playsinline></video>
            <canvas id="output_canvas"></canvas>
        </div>
    </div>

    <button id="webcamButton">ENABLE WEBCAM</button>

    <script type="module">
        import {
            HandLandmarker,
            FilesetResolver,
            DrawingUtils
        } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.0";

        const video = document.getElementById("webcam");
        const canvasElement = document.getElementById("output_canvas");
        const canvasCtx = canvasElement.getContext("2d");
        const webcamButton = document.getElementById("webcamButton");
        const uiOverlay = document.getElementById("ui-overlay");

        let handLandmarker = undefined;
        let lastVideoTime = -1;
        let lastSend = 0;

        // Configurations for independent finger scaling
        const fingerConfigs = {
            thumb:  { tip: 4,  min: 0.15, max: 0.45 },
            index:  { tip: 8,  min: 0.20, max: 0.70 },
            middle: { tip: 12, min: 0.20, max: 0.75 },
            ring:   { tip: 16, min: 0.20, max: 0.70 },
            pinky:  { tip: 20, min: 0.15, max: 0.60 }
        };

        function getDistance(p1, p2) {
            return Math.sqrt(Math.pow(p1.x - p2.x, 2) + Math.pow(p1.y - p2.y, 2) + Math.pow(p1.z - p2.z, 2));
        }

        async function createHandLandmarker() {
            const vision = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.0/wasm");
            handLandmarker = await HandLandmarker.createFromOptions(vision, {
                baseOptions: {
                    modelAssetPath: "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
                    delegate: "GPU"
                },
                runningMode: "VIDEO",
                numHands: 1
            });
            console.log("Model Ready");
        }
        createHandLandmarker();

        webcamButton.addEventListener("click", async () => {
            webcamButton.style.display = "none";
            const stream = await navigator.mediaDevices.getUserMedia({ video: true });
            video.srcObject = stream;
            video.addEventListener("loadeddata", () => {
                canvasElement.width = video.videoWidth;
                canvasElement.height = video.videoHeight;
                predictWebcam();
            });
        });

        async function predictWebcam() {
            let now = performance.now();
            if (lastVideoTime !== video.currentTime) {
                lastVideoTime = video.currentTime;
                const results = handLandmarker.detectForVideo(video, now);

                canvasCtx.save();
                canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
                const drawingUtils = new DrawingUtils(canvasCtx);

                // Clear previous frame's tracking UI panels
                uiOverlay.innerHTML = "";

                if (results.landmarks && results.landmarks.length > 0) {
                    // qs is built from the first detected hand, matching
                    // the backend which only tracks one hand's worth of
                    // finger channels
                    let qs = "";

                    results.landmarks.forEach((landmarks, handIndex) => {
                        drawingUtils.drawConnectors(landmarks, HandLandmarker.HAND_CONNECTIONS, { color: "#ffffff", lineWidth: 3 });
                        drawingUtils.drawLandmarks(landmarks, { color: "#ffffff", lineWidth: 1 });

                        const wrist = landmarks[0];

                        const handBox = document.createElement("div");
                        handBox.className = "hand-box";

                        const title = document.createElement("div");
                        title.className = "hand-title";
                        title.innerText = `Hand ${handIndex + 1}`;
                        handBox.appendChild(title);

                        for (const [name, config] of Object.entries(fingerConfigs)) {
                            const dist = getDistance(wrist, landmarks[config.tip]);
                            let openness = (dist - config.min) / (config.max - config.min);
                            openness = Math.min(Math.max(openness, 0), 1);
                            let percent = Math.round(openness * 100);

                            const row = document.createElement("div");
                            row.className = "finger-row";
                            row.innerHTML = `${name.charAt(0).toUpperCase() + name.slice(1)}: <span class="percent-val">${percent}%</span>`;
                            handBox.appendChild(row);

                            // only the first hand's values get sent to the backend
                            if (handIndex === 0) {
                                qs += name + "=" + percent + "&";
                            }
                        }

                        uiOverlay.appendChild(handBox);
                    });

                    if (now - lastSend >= 150) {
                        lastSend = now;
                        new Image().src = "/d?" + qs + "ts=" + Math.floor(now);
                    }
                }
                canvasCtx.restore();
            }
            window.requestAnimationFrame(predictWebcam);
        }
    </script>

</body>
</html>
